<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.company.name }} home">
      <i class="logo-mark" role="img" aria-label="Folly Consulting logo"></i>
      <span>{{ site.data.company.name }}</span>
    </a>
    <nav aria-label="Main">
      {% for item in site.data.navigation %}
        {% assign active = false %}
        {% if item.url == '/' and page.url == '/' %}{% assign active = true %}
        {% elsif item.url != '/' and page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
