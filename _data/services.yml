- title: Structured cabling
  text: Clean, labelled Cat6 and Cat6A runs, patch panels and terminations that are easy to trace and easy to grow.
- title: Wi-Fi and access points
  text: Site-surveyed placement and installation so coverage is reliable in every room, not just near the router.
- title: Network racks and switching
  text: Racks, switches, PoE and power planned and installed tidy, with room to expand.
- title: Displays and projectors
  text: Mounting, cabling and setup for displays and projectors in offices, meeting rooms and homes.
- title: Audio and speakers
  text: Speaker and audio installs that sound right for the space and hide the wiring.
- title: Conference room AV
  text: Meeting rooms that work the first time: screens, audio, cameras and simple controls.
