    - "Audio, speakers and microphones"
    - "Meeting and conference rooms"
    - "Digital signage and content playback"
    - "Cabling, racks and equipment layout"
    - "Upgrades to ageing or unreliable AV"
  engagements:
    - "Fitting out a new meeting room or office"
    - "Replacing a failing projector or sound system"
    - "Standardizing AV across several rooms"
- id: integration
  title: "Integration"
  summary: "Make networks, AV and other systems work together as one, instead of as separate islands."
  covers:
    - "Networked AV and how it sits on your LAN"
    - "Single-touch control of rooms and equipment"
    - "Connecting AV, meeting-room and network systems"
    - "Linking third-party platforms and devices"
    - "Testing, documentation and handover"
  engagements:
    - "AV that needs a properly designed network behind it"
    - "Several vendors' systems that don't talk to each other"
    - "Simplifying control for non-technical users"
- id: development
  title: "Development"
