- id: network
  title: "Network management and upgrades"
  summary: "Understand the network you have, then plan and carry out the changes it needs."
  covers:
    - "Network assessments, documentation and diagrams"
    - "Switching, routing and firewall upgrades"
    - "Wi-Fi surveys, design and upgrades"
    - "Structured cabling and rack clean-ups"
    - "VLANs, segmentation and security hardening"
    - "Ongoing management, monitoring and support"
  engagements:
    - "A site that has outgrown its network and needs a plan"
    - "Replacing end-of-life switches, firewalls or access points"
    - "Untangling an undocumented rack or closet"
- id: domains-email
  title: "Domains, DNS and business email"
  summary: "Get your business online under its own name, with professional email and the records behind it set up properly."
  covers:
    - "Domain registration, renewals and transfers"
    - "DNS management and records for your website, email and other services"
    - "Business email on your own domain, such as Microsoft 365 or Google Workspace"
    - "Moving from a generic @gmail or @hotmail address to name@yourbusiness.com"
    - "Email authentication (SPF, DKIM and DMARC) so your mail arrives and can't be spoofed"
    - "Domain verification for services such as Apple Business"
  engagements:
    - "A new business that needs a domain, website and email set up together"
    - "A business still using a personal email address that wants a professional one"
    - "Mail landing in spam, or a DNS change that broke something"
    - "Several domains and renewals that nobody is keeping track of"
  pricing:
    - "Setup: from $450, GST included (three-hour minimum). Covers the domain, DNS, accounts, mailboxes and email authentication."
    - "Additional time beyond setup: $150 per hour, GST included."
    - "Monthly: licences at or below the vendor's list price, plus a small management fee for DNS changes, user changes and renewals."
    - "Best suited to small businesses of fewer than 10 people. For larger organizations, we'll refer you to a provider that fits."
- id: av
  title: "AV system setup and upgrades"
